spring:
  application:
    name: multistate-service
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.ai.mcp.server.common.autoconfigure.McpServerAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${DB_PASSWORD:devpass}
    hikari:
      maximum-pool-size: 5
  data:
    mongodb:
      # Local dev points at an auth-less Mongo on 27017; tests override this via
      # @ServiceConnection (container) or application-test.yml.
      uri: mongodb://localhost:27017/statetrack
      auto-index-creation: true                      # (2) create @Indexed indexes on startup
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000                             # (3) 60s TTL — short enough to bound staleness
      cache-null-values: false                        # (4) don't cache "not found"
  flyway:
    locations: classpath:db/migration
    enabled: true
  jpa:
    hibernate:
      # validate (not none): compare every entity mapping to the live schema at
      # startup so a misnamed column or wrong type fails fast at deploy time
      # rather than as a buried PSQLException mid-transaction. The schema itself
      # is owned by db/V1__schema.sql — Hibernate only checks, never mutates.
      ddl-auto: validate
    # Disable OSIV: no lazy-loading from the web layer; sessions stay bounded to
    # the transactional service layer.
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
            # (1) Dummy IdP issuer for production wiring; tests override with a mock
            #     JwkSource via spring-security-test so they don't need a real IdP.
          issuer-uri: https://idp.example.internal/realms/uptimecrew
  identity:
    base-url: http://localhost:8090     # (1) WireMock stub address used by the contract test
  kafka:
    bootstrap-servers: localhost:9092         # (1) overridden by @ServiceConnection in tests
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: multistate-read-model-builder
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: '*'
    listener:
      ack-mode: RECORD
  ai:
    # mcp disabled for local dev due to missing dependency
    #mcp:
    #  server:
    #    name: multistate-mcp
    #    version: 1.0.0
    #    type: SYNC
    #    transport: SSE
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy}
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 1024
  graphql:
    graphiql:
      enabled: true
    web:
      path: /graphql
  otel:
    service:
      name: multistate-service
    exporter:
      otlp:
        endpoint: http://localhost:4318     # OTLP/HTTP default; matches `docker run` below
        protocol: http/protobuf
    traces:
      sampler: always_on                    # dev default; flip to parentbased_traceidratio in prod
    instrumentation:
      spring-kafka:
        enabled: true
      kafka:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      identity:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.uptimecrew.multistate: DEBUG     # turn up your own packages in local dev
    # W3 D1: surface the SecurityFilterChain Spring Security builds at startup
    # (and the request matchers it secures) so the resource-server wiring is
    # observable in local logs.
    org.springframework.security: DEBUG
    # W3 D4: log the SQL Hibernate emits so the GraphQL tenant.lines @BatchMapping
    # can be confirmed to issue ONE `where tenant_id in (...)` SELECT per generation
    # rather than N per-parent selects.
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Testcontainers will inject a real URL at runtime; this is just a placeholder
    # so the bean wiring doesn't fail in test contexts that don't use a DB.
    url: jdbc:postgresql://placeholder:5432/test
    username: test
    password: test
  jpa:
    # Never let Hibernate create/alter/validate a schema at startup under test —
    # the schema is owned by db/V1__schema.sql and applied explicitly by the ITs.
    # (Rejected the tooling's suggested ddl-auto: update — it would silently mutate
    # the schema and mask drift.) Repository/context ITs bring their own real
    # Testcontainers datasource via @ServiceConnection.
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.uptimecrew.multistate: INFO      # quieter than local dev under test
