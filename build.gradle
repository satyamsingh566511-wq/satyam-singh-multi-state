plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'        version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group   = 'com.uptimecrew.multistate'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
}

dependencies {
    // ── Spring Boot (NEW for W2 D3) ────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter'
    // Spring Boot 4 split the web stack into focused modules: the old
    // spring-boot-starter-web was renamed to spring-boot-starter-webmvc.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly    'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly    'org.postgresql:postgresql:42.7.3'

    // ── NEW for W2 D4: Spring Data JPA ─────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core:10.9.1'
    implementation 'org.flywaydb:flyway-database-postgresql:10.9.1'

    // ── NEW for W2 D5: Spring Data MongoDB + Redis + Cache abstraction ──
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'     // reuses the W2 D5 Redis as the distributed bucket store

    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.0'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:kafka:1.20.4'
    testImplementation 'org.awaitility:awaitility:4.2.2'

    // Spring Boot 4 modularised the test slices: @DataJpaTest and
    // @AutoConfigureTestDatabase are no longer carried by starter-test's
    // spring-boot-test-autoconfigure. Each slice now ships in a per-technology
    // *-test artifact (versions managed by the Spring Boot BOM).
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    // @AutoConfigureMockMvc moved here in the same Boot 4 modularisation — it is
    // no longer carried by starter-test's spring-boot-test-autoconfigure.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    // slf4j + logback are provided transitively by spring-boot-starter at
    // mutually consistent, BOM-managed versions. Hard-pinning logback-classic
    // here (was 1.5.6) skews against Spring Boot's newer logback-core and
    // throws AbstractMethodError at startup, so we let the BOM manage them.
    implementation     'org.slf4j:slf4j-api'

    // ── from W2 D2: Testcontainers + Postgres JDBC ─────────────────────
    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.7')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.postgresql:postgresql:42.7.3'

    // ── NEW for W2 D5: Testcontainers MongoDB module ───────────────────
    testImplementation 'org.testcontainers:mongodb'
    // Redis test uses the core GenericContainer with the redis:7-alpine image —
    // no extra Testcontainers module needed for simple use.
    testImplementation 'com.h2database:h2'

//    // Add to dependencies { ... } in build.gradle, alongside your W3 D1 lines.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // ── Direct Feign and Resilience4j (without Spring Cloud BOM) ─────────
    // Using direct libraries instead of Spring Cloud starters to avoid
    // classpath conflicts with Spring Boot 4.0.6.
    implementation 'io.github.openfeign:feign-core:13.2'
    implementation 'io.github.openfeign:feign-jackson:13.2'
    implementation 'io.github.openfeign:feign-slf4j:13.2'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'

    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
}

test {
    useJUnitPlatform()

    // Testcontainers/docker-java defaults to Docker API 1.32, which modern
    // daemons (Rancher Desktop, recent Docker Desktop, colima) reject with
    // "client version 1.32 is too old. Minimum supported API version is 1.41".
    // Pin a modern API version on the forked test JVM.
    systemProperty 'api.version', '1.41'

    // Rancher Desktop on macOS exposes its Docker socket at ~/.rd/docker.sock
    // (there is no /var/run/docker.sock). Auto-wire it for the test JVM so the
    // Testcontainers integration tests run with no manual env setup. This is a
    // no-op on Docker Desktop / colima — that socket file won't exist — so the
    // block stays portable for teammates. Anything already set in the
    // environment wins.
    def rancherSocket = file("${System.getProperty('user.home')}/.rd/docker.sock")
    if (rancherSocket.exists()) {
        if (System.getenv('DOCKER_HOST') == null) {
            environment 'DOCKER_HOST', "unix://${rancherSocket}"
        }
        if (System.getenv('TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE') == null) {
            // Ryuk bind-mounts the daemon socket; inside the Rancher VM it lives
            // at /var/run/docker.sock, not the host path above.
            environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
        }
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required  = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification