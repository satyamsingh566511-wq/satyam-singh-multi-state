name: web-ci

on:
  push:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: multistate-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: multistate-web/.nvmrc
          cache: npm
          cache-dependency-path: multistate-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
