name: web-ci

on:
  push:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: multistate-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: multistate-web/.nvmrc
          cache: pnpm
          cache-dependency-path: multistate-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Playwright needs a browser for the `check` script's E2E leg.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Single CI entrypoint: tsc --noEmit && eslint . && vitest --coverage && playwright test
      - name: Check (typecheck + lint + tests + coverage + e2e)
        run: pnpm run check

      - run: pnpm run build

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: multistate-web/playwright-report
          retention-days: 7
