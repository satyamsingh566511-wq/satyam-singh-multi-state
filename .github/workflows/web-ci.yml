name: web-ci

on:
  push:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'multistate-web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: multistate-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: multistate-web/.nvmrc
          cache: pnpm
          cache-dependency-path: multistate-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
